name: React app build and deploy
on:
  push:
    branches : ["main"]
jobs :
  build-and-push:
    runs-on: ubuntu-latest
    steps:
     - name : Checkout to code
       uses : actions/checkout@v4
      
     - name : Login to Docker Hub
       uses : docker/login-action@v3
       with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

     - name : Buid and push docker image 
       uses : docker/build-push-action@v5
       with:
         context: .
         file : ./Dockerfile
         push: true
         tags: ${{secrets.DOCKER_USERNAME}}/cicd:latest

  deploy :
   runs-on : ubuntu-latest
   needs : build-and-push
   steps:
     - name : SSH Into EC2 and Deploy COntainer
       uses : appleboy/ssh-action@v1.0.3
       with : 
         host: ${{secrets.EC2_HOST}}
         username: ${{secrets.EC2_USERNAME}}
         key : ${{secrets.EC2_SSH_KEY}}
         script : |
           docker pull ${{secrets.DOCKER_USERNAME}}/cicd:latest
           docker stop cicd-container || true
           docker rm cicd-container || true
           docker run -d --name cicd-container -p 5173:5173 ${{secrets.DOCKER_USERNAME}}/cicd:latest

